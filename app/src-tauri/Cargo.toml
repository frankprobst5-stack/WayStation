[package]
name = "waystation"
version = "0.1.0"
description = "Waystation — offline-first amateur radio dashboard"
authors = ["Frank, KJ4ESQ and Waystation contributors"]
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-dialog = "2"
sysinfo = "0.32"
roxmltree = "0.21.1"
sgp4 = "2.4"
sha2 = "0.10"
# default-features off deliberately drops the tokio requirement -- every
# other transport in this codebase (Pat, JS8Call, DX cluster) is
# synchronous std::thread + blocking I/O, and pulling in a second
# concurrency model just for this one integration isn't worth it. Just
# need the officially-generated protobuf message types here; the actual
# TCP client is hand-written against Meshtastic's own documented wire
# framing (verified from meshtastic.org before writing it).
meshtastic = { version = "0.1", default-features = false, features = ["serde"] }

